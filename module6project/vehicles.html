<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Jurassic Motors</title>
    <link rel="stylesheet" type="text/css" href="module6project.css">
</head>

<body>

    <header>
        <div class="topbar">
            <img src="Dino.png" alt="Jurassic Motors Logo" class="logo">

            <nav>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="service.html">Service</a></li>
                    <li><a href="vehicles.html">Vehicles</a></li>
                    <li><a href="clothing.html">Clothing</a></li>
                </ul>
            </nav>

            <div class="topbar-right">
                <p>Call Us: (505) 555‑1234</p>
                <p>Open: Mon-Sat 9:00 AM - 6:00 PM</p>
            </div>
        </div>
    </header>

    <h1 class="page-title">Vehicles</h1>
    <div class="divider"></div>
    <p class="center-paragraph"><em>FIND YOUR RIDE</em></p>

    <div class="vehicle-banner-image"></div>

    <div class="vehicletype-stack">
        <div class="vehicletype-card">SUVs</div>
        <div class="vehicletype-card">Sport Car</div>
        <div class="vehicletype-card">Truck</div>
        <div class="vehicletype-card">Electric</div>
    </div>

    <div class="vehicle-grid">

        <div class="vehicle-card">
            <img src="1969mustang.png" class="vehicle-img">
            <div class="vehicle-name">Mustang Boss 1969</div>
            <div class="price-box">$50,000</div>
            <button class="view-details">View details</button>
        </div>

        <div class="vehicle-card">
            <img src="car2021.png" class="vehicle-img">
            <div class="vehicle-name">Shelby Mustang 2021</div>
            <div class="price-box">$70,000</div>
            <button class="view-details">View details</button>
        </div>

        <div class="vehicle-card">
            <img src="toyotatacoma.png" class="vehicle-img">
            <div class="vehicle-name">Toyota Tacoma 2025</div>
            <div class="price-box">$35,000</div>
            <button class="view-details">View details</button>
        </div>

        <div class="vehicle-card">
            <img src="2024suv.png" class="vehicle-img">
            <div class="vehicle-name">Toyota Sequoia 2024</div>
            <div class="price-box">$50,000</div>
            <button class="view-details">View details</button>
        </div>

        <div class="vehicle-card">
            <img src="mustangmache.png" class="vehicle-img">
            <div class="vehicle-name">Mustang Mach E 2023</div>
            <div class="price-box">$39,500</div>
            <button class="view-details">View details</button>
        </div>

    </div>

</body>
</html>
